<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>調達管理ダッシュボード</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script defer src="{{ url_for('static', filename='js/app2.js') }}"></script>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" />
  <style>
    .hidden{display:none}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <h1>調達管理ダッシュボード</h1>
      <div class="header-actions">
        <label class="mode-toggle" title="本番/サンプル切替">
          <input type="checkbox" id="prodToggle" checked>
          <span>本番データ</span>
        </label>
        <button id="refreshBtn" class="btn">再読込</button>
      </div>
    </div>
  </header>

  <div class="container">
    <nav class="tabs">

      <div class="tabs-primary">

        <div class="tabs-segmented">

          <button class="tab active" data-tab="houchozan">発注残</button>

          <button class="tab" data-tab="short">短納期品</button>

          <button class="tab" data-tab="text_items">テキスト品</button>

          <button class="tab" data-tab="reschedule">再日程計画確認</button>

        </div>

        <div class="global-filters" title="分類で全タブを絞り込み">

          <label>

            <span>分類</span>

            <select id="globalKindSelect">

              <option value="">(指定なし)</option>

              <option value="TRP">TRP</option>

              <option value="SVF">SVF</option>

            </select>

          </label>

        </div>

        <div class="logic-switch">

          絞り込み:

          <label class="chip"><input type="radio" name="logic" value="AND" checked /> AND</label>

          <label class="chip"><input type="radio" name="logic" value="OR" /> OR</label>

        </div>

      </div>

      <div class="data-dates" title="データ日時">

        <span class="muted">データ日時:</span>

        <span id="dataDates" class="date-badges"></span>

      </div>

    </nav>



    <section class="filters card filter-card" id="filters-card-houchozan">
      <div class="card-title"><span class="dot dot-accent"></span> 発注残 フィルタ</div>
      <div class="filters-row hz-names-row">
        <label class="field wide"><span>名称</span>
          <div class="hz-name">
            <select id="hzNameSelect"></select>
            <input type="text" id="hzNameInput" placeholder="名称の追加" />
            <button class="btn" id="hzNameAddBtn" type="button">追加</button>
          </div>
        </label>
      </div>
      <div class="filters-row" id="filters-houchozan">
        <label class="field sm"><span>名称</span><input type="text" data-col="C" placeholder="部分一致" /></label>
        <label class="field sm"><span>品目コード</span><input type="text" data-col="D" placeholder="部分一致" /></label>
        <label class="field sm"><span>品目種別</span>
          <select data-col="__kind__">
            <option value="">(指定なし)</option>
            <option value="テキスト品">テキスト品</option>
            <option value="消耗品">消耗品</option>
            <option value="通常">通常</option>
          </select>
        </label>
        <label class="field wide"><span>明細納入日付</span>
          <div class="range">
            <input type="date" data-col="P" data-date="from" />
            <span>〜</span>
            <input type="date" data-col="P" data-date="to" />
          </div>
        </label>
      </div>
    </section>

    <section class="filters card filter-card hidden" id="filters-card-text_items">
      <div class="card-title"><span class="dot dot-accent"></span> テキスト品 フィルタ</div>
      <div class="filters-row names-row">
        <label class="field wide"><span>名称</span>
          <div class="hz-name">
            <select id="tiNameSelect"></select>
          </div>
        </label>
      </div>
      <div class="filters-row" id="filters-text_items">
        <label class="field sm"><span>名称</span><input type="text" data-col="C" placeholder="部分一致" /></label>
        <label class="field sm"><span>品目コード</span><input type="text" data-col="D" placeholder="部分一致" /></label>
        <label class="field wide"><span>明細納入日付</span>
          <div class="range">
            <input type="date" data-col="P" data-date="from" />
            <span>〜</span>
            <input type="date" data-col="P" data-date="to" />
          </div>
        </label>
      </div>
    </section>

    <section class="filters card filter-card hidden" id="filters-card-short">
      <div class="card-title"><span class="dot dot-accent"></span> 短納期品 フィルタ</div>
      <div class="filters-row names-row">
        <label class="field wide"><span>名称</span>
          <div class="hz-name">
            <select id="shortNameSelect"></select>
          </div>
        </label>
      </div>
      <div class="filters-row" id="filters-short">
        <label class="field sm"><span>品目コード</span><input type="text" data-col="A" placeholder="部分一致" /></label>
        <label class="field sm"><span>仕入れ先名称</span><input type="text" data-col="I" placeholder="部分一致" /></label>
        <label class="field sm"><span>調達タイプ</span><input type="text" data-col="K" placeholder="部分一致" /></label>
      </div>
    </section>

    <section class="filters card filter-card hidden" id="filters-card-reschedule">
      <div class="card-title"><span class="dot dot-accent"></span> 再日程計画確認 フィルタ</div>
      <div class="filters-row" id="filters-reschedule">
        <label class="field sm"><span>A列</span><input type="text" data-col="A" placeholder="部分一致" /></label>
        <label class="field sm"><span>D列</span><input type="text" data-col="D" placeholder="部分一致" /></label>
      </div>
    </section>

    <main>
      <div class="card table-wrapper">
        <div class="table-toolbar">
          <button id="tableAutoFit" class="btn" type="button" title="表示中タブの列幅を内容に合わせて再計算します">列幅自動調整</button>
          <button id="tableResetWidths" class="btn" type="button" title="保存済みの列幅設定を削除して既定幅に戻します">列幅リセット</button>
        </div>
        <div id="table-container"></div>
      </div>
      <div class="pager">
        <button id="prevPage" class="btn">前へ</button>
        <span id="pageInfo" class="muted"></span>
        <button id="nextPage" class="btn">次へ</button>
      </div>
    </main>
  </div>

  <footer>
    <small>© SCM Management</small>
  </footer>
</body>
</html>
